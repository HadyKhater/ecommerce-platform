@if (showSplash()) {
<div class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-950 overflow-hidden transition-opacity duration-500 ease-out">
  <!-- Background gradient circles -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/3 right-1/4 w-80 h-80 bg-violet-500/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
  <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>

  <!-- Center content -->
  <div class="relative z-10 flex flex-col items-center gap-10 px-4">
    <!-- Logo Section -->
    <div class="flex flex-col items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500/20 to-violet-500/20 shadow-lg shadow-indigo-500/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
        </div>
        <span class="text-2xl font-bold text-white tracking-tight">NTGStore</span>
      </div>
      <p class="text-sm text-slate-400">Preparing your experience</p>
    </div>

    <!-- Loading Bar -->
    <div class="w-full max-w-xs">
      <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
        <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-violet-500 to-indigo-500 bg-[length:200%_100%] loading-bar-animation shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
      </div>
    </div>

    <!-- Status Text with animated dots -->
    <p class="text-sm text-slate-400 font-medium tracking-wide">
      Verifying your session<span class="animate-pulse">...</span>
    </p>
  </div>

  <!-- Footer copyright -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2">
    <p class="text-xs text-slate-600 font-medium">NTGStore © 2026</p>
  </div>
</div>
} @else {
<main class="min-h-screen bg-dark text-slate-100 antialiased">
  @if (!isAdminRoute && !isAuthPage) {
  <app-navbar />
  }
  <div [ngClass]="isAdminRoute || isAuthPage ? '' : 'pt-16'">
    <router-outlet />
  </div>
  @if (!isAdminRoute && !isAuthPage) {
  <app-footer />
  }
</main>
}
