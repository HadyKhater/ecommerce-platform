<div class="relative">
  <!-- Bell Button -->
  <button
    type="button"
    class="relative rounded-lg p-2 text-slate-400 transition-all duration-200 hover:bg-slate-800 hover:text-slate-200 hover:scale-105"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Notifications"
  >
    <!-- Beautiful Animated Bell SVG -->
    <svg
      class="h-5 w-5 transition-transform duration-300"
      [ngClass]="{'rotate-12': notificationService.unreadCount() > 0}"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      />
    </svg>

    <!-- Unread Count Badge -->
    <span
      *ngIf="notificationService.unreadCount() > 0"
      class="absolute -top-1 -right-1 bg-gradient-to-r from-red-500 to-rose-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold shadow-lg shadow-rose-500/30 animate-pulse"
    >
      {{ notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount() }}
    </span>
  </button>

  <!-- Dropdown Panel (Glassmorphism + Slate Dark Mode) -->
  <div
    *ngIf="isOpen()"
    class="absolute right-0 top-full z-50 mt-2 w-80 md:w-96 rounded-2xl border border-slate-800 bg-slate-900/95 backdrop-blur-xl shadow-2xl shadow-black/40 overflow-hidden transform origin-top-right transition-all duration-200"
    (click)="$event.stopPropagation()"
  >
    <!-- Dropdown Header -->
    <div class="flex items-center justify-between border-b border-slate-800/80 px-4 py-3 bg-slate-950/40">
      <div class="flex items-center gap-2">
        <h3 class="text-sm font-semibold text-slate-100">Notifications</h3>
        <span
          *ngIf="notificationService.unreadCount() > 0"
          class="rounded-full bg-indigo-500/10 px-2 py-0.5 text-xs font-medium text-indigo-400"
        >
          {{ notificationService.unreadCount() }} new
        </span>
      </div>
      <button
        *ngIf="notificationService.unreadCount() > 0"
        type="button"
        class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors"
        (click)="markAllAsRead()"
      >
        Mark all as read
      </button>
    </div>

    <!-- Notifications List -->
    <div class="max-h-[360px] overflow-y-auto divide-y divide-slate-800/50 custom-scrollbar">
      <ng-container *ngIf="notificationService.notifications().length > 0; else emptyState">
        <div
          *ngFor="let notification of notificationService.notifications()"
          [ngClass]="{
            'bg-indigo-500/[0.03] hover:bg-indigo-500/[0.06]': !notification.isRead,
            'hover:bg-slate-800/40': notification.isRead
          }"
          class="group relative flex gap-3 px-4 py-3.5 transition-all duration-150 cursor-pointer"
          (click)="onNotificationClick(notification, $event)"
        >
          <!-- Notification Icon Container -->
          <div class="flex-shrink-0">
            <div
              [ngClass]="{
                'bg-indigo-500/10 text-indigo-400': notification.type === 'ORDER',
                'bg-emerald-500/10 text-emerald-400': notification.type === 'PAYMENT',
                'bg-amber-500/10 text-amber-400': notification.type === 'SYSTEM'
              }"
              class="flex h-9 w-9 items-center justify-center rounded-xl transition-all duration-300 group-hover:scale-105"
            >
              <!-- Dynamic SVG based on notification type -->
              <!-- ORDER Icon -->
              <svg
                *ngIf="notification.type === 'ORDER'"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                />
              </svg>

              <!-- PAYMENT Icon -->
              <svg
                *ngIf="notification.type === 'PAYMENT'"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"
                />
              </svg>

              <!-- SYSTEM Icon -->
              <svg
                *ngIf="notification.type === 'SYSTEM'"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                />
              </svg>
            </div>
          </div>

          <!-- Notification Details -->
          <div class="flex-1 min-w-0 pr-6">
            <h4
              [ngClass]="{'font-semibold text-slate-100': !notification.isRead, 'font-medium text-slate-300': notification.isRead}"
              class="text-xs tracking-tight"
            >
              {{ notification.title }}
            </h4>
            <p class="mt-0.5 text-xs text-slate-400 line-clamp-2 leading-relaxed">
              {{ notification.message }}
            </p>
            <span class="mt-1 block text-[10px] text-slate-500 font-medium">
              {{ getRelativeTime(notification.createdAt) }}
            </span>
          </div>

          <!-- Unread Dot / Mark as Read Option -->
          <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center">
            <!-- Blue dot indicator if unread -->
            <span
              *ngIf="!notification.isRead"
              class="h-2 w-2 rounded-full bg-indigo-500 shadow-sm shadow-indigo-500/50 group-hover:hidden"
            ></span>

            <!-- Mark as read checkmark button on hover -->
            <button
              *ngIf="!notification.isRead"
              type="button"
              class="hidden group-hover:flex items-center justify-center h-6 w-6 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-all duration-150"
              (click)="markAsRead(notification, $event)"
              title="Mark as read"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </div>
      </ng-container>

      <!-- Empty State -->
      <ng-template #emptyState>
        <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-800/40 border border-slate-700/50 mb-3.5">
            <svg class="h-6 w-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
          </div>
          <p class="text-xs font-semibold text-slate-300">All caught up!</p>
          <p class="mt-1 text-[11px] text-slate-500 max-w-[200px] leading-relaxed">
            You don't have any notifications at the moment.
          </p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
